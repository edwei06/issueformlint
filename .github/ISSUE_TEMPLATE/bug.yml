name: Bug report
description: Report a problem with issueformlint.
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve issueformlint.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal issue form example
      render: yaml
