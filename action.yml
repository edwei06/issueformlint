name: issueformlint
description: Check GitHub issue forms and template chooser configuration
inputs:
  path:
    description: Repository root or ISSUE_TEMPLATE directory to check
    required: false
    default: .
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '20'
    - name: Install dependencies
      shell: bash
      run: npm ci --ignore-scripts --prefix "$GITHUB_ACTION_PATH"
    - name: Check issue templates
      shell: bash
      env:
        ISSUEFORMLINT_PATH: ${{ inputs.path }}
      run: node "$GITHUB_ACTION_PATH/bin/issueformlint.js" "$ISSUEFORMLINT_PATH" --format github
branding:
  icon: check-circle
  color: blue
